function render(){const titles={map:&#x27;Mali koraci. &lt;span&gt;Stvaran pomak.&lt;/span&gt;&#x27;,calendar:&#x27;Napravi prostor &lt;span&gt;za bitno.&lt;/span&gt;&#x27;,ghost:&#x27;Upoznaj svog &lt;span&gt;budućeg sebe.&lt;/span&gt;&#x27;,rewards:&#x27;Trud koji se &lt;span&gt;nagrađuje.&lt;/span&gt;&#x27;,detail:&#x27;Jedan zadatak. &lt;span&gt;Jedan pomak.&lt;/span&gt;&#x27;,new:&#x27;Tvoj sljedeći &lt;span&gt;korak.&lt;/span&gt;&#x27;,reschedule:&#x27;Napravi mjesta &lt;span&gt;u kalendaru.&lt;/span&gt;&#x27;,personal:&#x27;Nagrada &lt;span&gt;po tvojoj mjeri.&lt;/span&gt;&#x27;,rules:&#x27;Tvoj tempo. &lt;span&gt;Jasna pravila.&lt;/span&gt;&#x27;};const labels={map:&#x27;Moja mapa&#x27;,calendar:&#x27;Kalendar&#x27;,ghost:&#x27;Moj ghost&#x27;,rewards:&#x27;Nagrade&#x27;,detail:&#x27;Zadatak&#x27;,new:&#x27;Novi zadatak&#x27;,reschedule:&#x27;Odgoda&#x27;,personal:&#x27;Osobna nagrada&#x27;,rules:&#x27;Pravila igre&#x27;};root.querySelector(&#x27;#fs-page-title&#x27;).innerHTML=titles[state.view]||titles.map;root.querySelector(&#x27;#fs-breadcrumb&#x27;).textContent=&#x27;Tvoj prostor / &#x27;+(labels[state.view]||&#x27;Moja mapa&#x27;);root.querySelectorAll(&#x27;[data-view].fs-nav&#x27;).forEach(b=&gt;{const active=b.dataset.view===state.view;b.classList.toggle(&#x27;is-active&#x27;,active);if(active)b.setAttribute(&#x27;aria-current&#x27;,&#x27;page&#x27;);else b.removeAttribute(&#x27;aria-current&#x27;);});content.innerHTML=({map:mapView,calendar:calendarView,ghost:ghostView,rewards:rewardsView,detail:detailView,new:newView,reschedule:rescheduleView,rules:rulesView}[state.view]||mapView)();metrics();icons();}
